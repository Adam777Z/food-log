<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Food Log</title>
	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Bootstrap Icons -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
	<!-- Custom CSS -->
	<link rel="stylesheet" href="styles.min.css">
</head>

<body class="bg-light">
	<div class="container py-4">
		<!-- Header -->
		<header class="mb-4">
			<div class="d-flex justify-content-between align-items-center gap-2 flex-wrap">
				<h1 class="mb-0">
					<i class="bi bi-book-half"></i> Food Log
				</h1>
				<div class="d-flex gap-2">
					<button id="add_day_btn" class="btn btn-primary">
						<i class="bi bi-calendar-plus"></i> Add Day
					</button>
					<button id="backup_btn" class="btn btn-info" title="Export data as JSON">
						<i class="bi bi-download"></i> Backup
					</button>
					<button id="restore_btn" class="btn btn-warning" title="Import data from JSON">
						<i class="bi bi-upload"></i> Restore
					</button>
					<button id="erase_btn" class="btn btn-danger" title="Erase all data">
						<i class="bi bi-trash"></i> Erase All Data
					</button>
					<input type="file" id="restore_file" accept=".json" style="display:none;">
				</div>
			</div>
		</header>

		<!-- Search Section -->
		<section id="search_section" class="mb-4 p-3 bg-white rounded shadow-sm">
			<h5 class="mb-3">
				<i class="bi bi-search"></i> Search Meals
			</h5>
			<div class="row g-3">
				<div class="col-md-3">
					<input type="date" id="search_date" class="form-control" placeholder="Date">
				</div>
				<div class="col-md-3">
					<input type="text" id="search_meal_name" class="form-control" placeholder="Meal name">
				</div>
				<div class="col-md-2">
					<input type="number" id="search_calories" class="form-control" placeholder="Calories (kcal)">
				</div>
				<div class="col-md-3">
					<input type="text" id="search_notes" class="form-control" placeholder="Notes">
				</div>
			</div>
			<div class="mt-2">
				<button id="search_btn" class="btn btn-sm btn-success">
					<i class="bi bi-search"></i> Search
				</button>
				<button id="clear_search_btn" class="btn btn-sm btn-secondary">
					<i class="bi bi-x"></i> Clear
				</button>
			</div>
		</section>

		<!-- Days Container -->
		<main id="days_container" class="d-flex flex-column gap-4">
			<!-- Days will be dynamically added here -->
		</main>
	</div>

	<!-- Modals -->

	<!-- Add Day Modal -->
	<div class="modal fade" id="add_day_modal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">
						<i class="bi bi-calendar-plus"></i> Add Day
					</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<form id="add_day_form">
						<div class="mb-3">
							<label for="add_day_date" class="form-label">Select Date</label>
							<input type="date" class="form-control" id="add_day_date" required>
						</div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
					<button type="button" class="btn btn-primary" id="save_day_btn">Add Day</button>
				</div>
			</div>
		</div>
	</div>

	<!-- Edit Day Date Modal -->
	<div class="modal fade" id="edit_day_modal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">
						<i class="bi bi-calendar-edit"></i> Change Day Date
					</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<form id="edit_day_form">
						<div class="mb-3">
							<label for="edit_day_date" class="form-label">New Date</label>
							<input type="date" class="form-control" id="edit_day_date" required>
						</div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
					<button type="button" class="btn btn-primary" id="save_edit_day_btn">Update Date</button>
				</div>
			</div>
		</div>
	</div>

	<!-- Add/Edit Meal Modal -->
	<div class="modal fade" id="meal_modal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">
						<i class="bi bi-plus-circle"></i> <span id="meal_modal_title">Add Meal</span>
					</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<form id="meal_form">
						<div class="mb-3">
							<label for="meal_name" class="form-label">Meal Name</label>
							<input type="text" class="form-control" id="meal_name" placeholder="for example: drink 300 ml, soup 300 g, salt 1 g, water 300 ml" required>
						</div>
						<div class="mb-3">
							<label for="meal_time" class="form-label">Time of Day</label>
							<div class="input-group">
								<select class="form-select" id="meal_time" required>
									<option value="">Select time</option>
									<option value="overnight">Overnight</option>
									<option value="morning">Morning</option>
									<option value="beforeNoon">Before Noon</option>
									<option value="afternoon">Afternoon</option>
									<option value="evening">Evening</option>
									<option value="night">Night</option>
									<option value="custom">Custom</option>
								</select>
							</div>
							<input type="text" class="form-control mt-2" id="meal_time_custom"
								placeholder="Enter custom time" style="display:none;">
						</div>
						<div class="mb-3">
							<label for="meal_calories" class="form-label">Calories (kcal)</label>
							<input type="number" class="form-control" id="meal_calories" min="0" step="0.1" required>
						</div>
						<div class="mb-3">
							<label for="meal_notes" class="form-label">Notes</label>
							<textarea class="form-control" id="meal_notes" rows="3"></textarea>
						</div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
					<button type="button" class="btn btn-primary" id="save_meal_btn">Save Meal</button>
				</div>
			</div>
		</div>
	</div>

	<!-- Dexie.js -->
	<script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"></script>
	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<!-- Application JS -->
	<script src="app.min.js"></script>
</body>

</html>
